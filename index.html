<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Арсен Маркарян — Видеоархив (967 записей)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f0f10;
      --bg-surface: #18181b;
      --bg-card: #1f1f23;
      --bg-card-hover: #27272e;
      --bg-pill: #27272a;
      --bg-pill-active: #ffffff;
      
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      
      --text-main: #f4f4f5;
      --text-sub: #a1a1aa;
      --text-muted: #71717a;
      --text-pill-active: #09090b;
      
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.3);
      --fav: #eab308;
      --watched: #10b981;

      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      body {
        padding-bottom: 65px;
      }
    }

    /* Modern App Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 16, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 0.72rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 500;
    }

    .desktop-nav {
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    @media (min-width: 769px) {
      .desktop-nav {
        display: flex;
      }
    }

    .nav-link-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-link-btn:hover {
      color: var(--text-main);
      background: var(--bg-surface);
    }

    .nav-link-btn.active {
      color: var(--text-main);
      background: var(--bg-card);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-icon {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }

    .btn-icon:hover, .btn-icon.active {
      color: var(--text-main);
      border-color: var(--border-hover);
      background: var(--bg-card);
    }

    /* Main Player Section (Responsive) */
    .player-outer {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0;
    }

    @media (min-width: 769px) {
      .player-outer {
        padding: 1.25rem 1.25rem 0.5rem 1.25rem;
      }
    }

    .player-card {
      background: #000;
      overflow: hidden;
    }

    @media (min-width: 769px) {
      .player-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
    }

    .player-desktop-layout {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .player-desktop-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
      }
    }

    .player-main-col {
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      max-height: 70vh;
    }

    .video-viewport iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .embed-fallback {
      position: absolute;
      inset: 0;
      background: #141416;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      z-index: 5;
    }

    .embed-fallback.active {
      display: flex;
    }

    .embed-fallback h4 {
      font-size: 1.05rem;
      margin-bottom: 0.4rem;
    }

    .embed-fallback p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 1rem;
      max-width: 380px;
    }

    /* Video Details & Action Carousel */
    .player-details {
      padding: 0.85rem 1rem 1rem 1rem;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
    }

    .video-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    @media (min-width: 769px) {
      .video-title {
        font-size: 1.2rem;
      }
    }

    .video-meta-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }

    .meta-tag {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      color: var(--accent);
      font-weight: 500;
    }

    .action-chips-scroll {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.2rem;
    }

    .action-chips-scroll::-webkit-scrollbar {
      display: none;
    }

    .action-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
      text-decoration: none;
      transition: all 0.15s;
    }

    .action-pill:active, .action-pill:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
    }

    .action-pill.active {
      background: var(--text-main);
      color: #000;
      border-color: var(--text-main);
      font-weight: 600;
    }

    .action-pill.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Sidebar Queue (Visible on desktop >= 1024px) */
    .player-queue-col {
      display: none;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    @media (min-width: 1024px) {
      .player-queue-col {
        display: flex;
      }
    }

    .queue-header {
      padding: 0.85rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .queue-scroll {
      flex: 1;
      overflow-y: auto;
      max-height: 520px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .queue-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .queue-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .queue-card {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .queue-card:hover {
      background: var(--bg-card-hover);
    }

    .queue-card.is-current {
      border-color: var(--accent);
      background: rgba(239, 68, 68, 0.08);
    }

    .queue-thumb {
      width: 68px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .queue-info {
      flex: 1;
      min-width: 0;
    }

    .queue-title {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .queue-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Search & Category Header */
    .controls-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 1.25rem 0.5rem 1.25rem;
    }

    .search-input-wrap {
      position: relative;
      margin-bottom: 0.75rem;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      padding: 0.65rem 2.2rem 0.65rem 2.6rem;
      border-radius: 9999px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--border-hover);
      box-shadow: 0 0 0 1px var(--border-hover);
    }

    .search-icon-svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
      pointer-events: none;
    }

    .search-clear-btn {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
      padding: 0.2rem;
    }

    /* Category Filter Pills (YouTube Mobile Style) */
    .categories-scroll {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.25rem;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--bg-pill);
      border: none;
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }

    .cat-pill:hover {
      background: #333338;
    }

    .cat-pill.active {
      background: var(--bg-pill-active);
      color: var(--text-pill-active);
      font-weight: 600;
    }

    /* Subheader stats */
    .feed-meta-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.6rem 1.25rem 0.5rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .view-mode-toggle {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      padding: 2px;
    }

    .view-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .view-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 600;
    }

    /* CATALOG FEED */
    .catalog-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 3rem 1.25rem;
    }

    /* 1. Grid View */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    @media (max-width: 600px) {
      .catalog-grid {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
    }

    .media-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, border-color 0.15s;
    }

    .media-card:active {
      transform: scale(0.985);
    }

    .media-card:hover {
      border-color: var(--border-hover);
    }

    .media-card.is-current {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .card-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
    }

    .card-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-duration {
      position: absolute;
      bottom: 0.45rem;
      right: 0.45rem;
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .card-cat-badge {
      position: absolute;
      top: 0.45rem;
      left: 0.45rem;
      background: rgba(15, 15, 16, 0.85);
      backdrop-filter: blur(6px);
      color: var(--text-main);
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .card-body {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-title-text {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .play-now-label {
      color: var(--accent);
      font-weight: 600;
    }

    /* 2. List / Stream View */
    .catalog-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .list-item {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }

    .list-item:active {
      background: var(--bg-card);
    }

    .list-item:hover {
      border-color: var(--border-hover);
    }

    .list-item.is-current {
      border-color: var(--accent);
    }

    .list-thumb {
      width: 105px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background: #111;
    }

    .list-body {
      flex: 1;
      min-width: 0;
    }

    .list-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    .list-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Load More Button */
    .load-more-wrap {
      text-align: center;
      margin-top: 1.75rem;
    }

    .btn-load-more {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.7rem 1.8rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-load-more:hover {
      background: var(--bg-card);
      border-color: var(--border-hover);
    }

    /* Bottom Floating Bar on Mobile (hidden on desktop) */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 15, 16, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 0.4rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 45;
    }

    @media (min-width: 769px) {
      .mobile-bottom-bar {
        display: none;
      }
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0.3rem 0.8rem;
      transition: color 0.15s;
    }

    .nav-tab.active, .nav-tab:hover {
      color: var(--text-main);
    }

    .nav-tab svg {
      width: 18px;
      height: 18px;
    }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: 4.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }

    .toast-pill {
      background: #27272a;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.55rem 1rem;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Clean App Header -->
  <header class="app-header">
    <div class="header-inner">
      <a href="#" class="brand-wrap">
        <div class="brand-icon">▶</div>
        <span class="brand-title">Маркарян</span>
        <span class="brand-badge">967 видео</span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="desktop-nav">
        <button class="nav-link-btn active" id="deskNavAll">Каталог</button>
        <button class="nav-link-btn" id="deskNavPodcasts">Подкасты</button>
        <button class="nav-link-btn" id="deskNavDebates">Дебаты</button>
        <button class="nav-link-btn" id="deskNavPeriscope">Архив 2014–2020</button>
        <button class="nav-link-btn" id="deskNavFavs">★ Избранное</button>
      </nav>

      <div class="header-actions">
        <button class="btn-icon" id="headerFavBtn" title="Избранное">★</button>
        <button class="btn-icon" id="headerShuffleBtn" title="Случайное видео">🎲</button>
      </div>
    </div>
  </header>

  <!-- Player Stage (At Top) -->
  <section class="player-outer" id="playerSection">
    <div class="player-card">
      <div class="player-desktop-layout">
        <!-- Main Player Col -->
        <div class="player-main-col">
          <div class="video-viewport">
            <div id="playerFrameMount"></div>

            <!-- Fallback if embedding is blocked -->
            <div class="embed-fallback" id="embedFallback">
              <h4>Встраивание ограничено автором</h4>
              <p>Автор этого видео запретил встроенный просмотр. Вы можете открыть его напрямую на YouTube:</p>
              <a class="action-pill primary" id="embedDirectYtBtn" href="#" target="_blank">Смотреть на YouTube ↗</a>
            </div>
          </div>

          <!-- Video Details & Action Carousel -->
          <div class="player-details">
            <div class="video-meta-row">
              <span class="meta-tag" id="nowPlayingTag">ПОДКАСТ</span>
              <span id="nowPlayingIndex">#1</span>
              <span>•</span>
              <span id="nowPlayingCat">Главные интервью и дебаты</span>
            </div>

            <h1 class="video-title" id="nowPlayingTitle">Загрузка...</h1>

            <div class="action-chips-scroll">
              <button class="action-pill" id="actionFavBtn">★ В избранное</button>

    function classify(item) {

      if (t.includes('дебат') || t.includes('спор') || t.includes('соболев vs')) return 'debates';
      if (t.includes('интервью') || t.includes('подкаст') || t.includes('шоу «грязь»') || t.includes('latecast') || t.includes('соломин') || t.includes('resolut1on') || t.includes('светов')) return 'podcasts';

      if (c.includes('эффективный')) return 'effective';
      if (t.includes('тестостерон') || t.includes('гормон') || t.includes('дофамин') || t.includes('биохакинг') || t.includes('бад') || t.includes('питани') || t.includes('сон')) return 'biohack';

      if (t.includes('деньг') || t.includes('бизнес') || t.includes('система') || t.includes('инфобиз') || t.includes('ai') || t.includes('будущ')) return 'business';
      return 'other';

    }

    // Mount or play video
    function playVideo(item, shouldScroll = false, autoplay = true) {
      if (!item) return;
      currentVideo = item;
      localStorage.setItem('m_last_id', item.id);

      try {
        history.replaceState(null, null, '#v=' + item.id);
      } catch(e) {}

      if (autoplay && !watched.includes(item.id)) {
        watched.push(item.id);
        localStorage.setItem('m_watched', JSON.stringify(watched));
      }

      // UI
      nowPlayingTitle.textContent = item.title;
      nowPlayingIndex.textContent = `#${item.originalIndex}`;
      nowPlayingTag.textContent = getCategoryName(item.tag);
      nowPlayingCat.textContent = item.cat;
      actionYtBtn.href = item.url;
      embedDirectYtBtn.href = item.url;

      updateActionButtons();
      embedFallback.classList.remove('active');

      if (isYtReady && ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        if (autoplay) {

          ytPlayer.cueVideoById(item.id);

      } else {

    function renderIframe(id, autoplay) {
      const ap = autoplay ? '1' : '0';
      playerFrameMount.innerHTML = `
        <iframe id="mainYtIframe"
          src="https://www.youtube.com/embed/${id}?enablejsapi=1&autoplay=${ap}&rel=0&modestbranding=1"

          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

        </iframe>
      `;

      if (window.YT && YT.Player) {
        try {
          ytPlayer = new YT.Player('mainYtIframe', {
            events: {
              'onStateChange': (e) => {
                if (e.data === 0 && autoPlay) playNext(); // Ended
              },
              'onError': (e) => {
                if (e.data === 101 || e.data === 150 || e.data === 153 || e.data === 100) {

              }
            }
          });

        playVideo(list[idx + 1], true, true);

      const i = favorites.indexOf(id);
      if (i >= 0) {
        favorites.splice(i, 1);
        showToast('Удалено из избранного');
      } else {
        favorites.push(id);
        showToast('★ Добавлено в избранное');
      }
      localStorage.setItem('m_favs', JSON.stringify(favorites));
      updateActionButtons();
      if (currentCategory === 'fav') applyFilter();
    }

    function toggleWatched(id) {
      const i = watched.indexOf(id);
      if (i >= 0) {
        watched.splice(i, 1);
        showToast('Отметка снята');
      } else {
        watched.push(id);
        showToast('✓ Отмечено как просмотренное');
      }
      localStorage.setItem('m_watched', JSON.stringify(watched));
      updateActionButtons();
    }

    function highlightCurrentCard() {
      if (!currentVideo) return;
      document.querySelectorAll('.media-card, .list-item').forEach(el => {
        el.classList.toggle('is-current', el.dataset.id === currentVideo.id);
      });
    }

    function renderQueue() {
      const list = filteredItems.length > 0 ? filteredItems : ITEMS;
      const currIdx = list.findIndex(i => i.id === currentVideo?.id);
      const start = Math.max(0, currIdx >= 0 ? currIdx : 0);
      const queueItems = list.slice(start, start + 30);

      queueScroll.innerHTML = queueItems.map(it => {
        const isCur = it.id === currentVideo?.id;
        return `
          <div class="queue-card ${isCur ? 'is-current' : ''}" data-qid="${it.id}">
            <img class="queue-thumb" src="https://i.ytimg.com/vi/${it.id}/default.jpg" loading="lazy" alt="">
            <div class="queue-info">
              <div class="queue-title">${isCur ? '▶ ' : ''}${it.title}</div>
              <div class="queue-meta">#${it.originalIndex} • ${getCategoryName(it.tag)}</div>
            </div>
          </div>
        `;
      }).join('');

      queueScroll.querySelectorAll('.queue-card').forEach(c => {
        c.addEventListener('click', () => {
          const it = ITEMS.find(x => x.id === c.dataset.qid);
          if (it) playVideo(it, true, true);
        });
      });
    }

    // Categories UI
    function renderCategoryPills() {
      categoriesScroll.innerHTML = CATEGORIES.map(c => {
        const isAct = currentCategory === c.id ? 'active' : '';
        return `<button class="cat-pill ${isAct}" data-cat="${c.id}">${c.label}</button>`;
      }).join('');

      categoriesScroll.querySelectorAll('.cat-pill').forEach(b => {
        b.addEventListener('click', () => {
          currentCategory = b.dataset.cat;
          limit = CHUNK_SIZE;
          renderCategoryPills();
          applyFilter();
        });
      });
    }

    function applyFilter() {
      const q = searchQuery.trim().toLowerCase();

      filteredItems = ITEMS.filter(it => {
        if (currentCategory === 'fav') {
          if (!favorites.includes(it.id)) return false;
        } else if (currentCategory !== 'all') {
          if (it.tag !== currentCategory) return false;
        }

        if (q) {
          return it.title.toLowerCase().includes(q) ||
                 it.cat.toLowerCase().includes(q) ||
                 it.id.toLowerCase().includes(q);
        }
        return true;
      });

      feedCountText.textContent = `${filteredItems.length} видео`;
      renderFeed();
      renderQueue();
    }

    function renderFeed() {
      const slice = filteredItems.slice(0, limit);

      btnLoadMore.style.display = limit < filteredItems.length ? 'inline-block' : 'none';

      if (slice.length === 0) {
        catalogGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 3rem 1rem; color: var(--text-muted);">Ничего не найдено</div>';
        catalogList.innerHTML = '<div style="text-align:center; padding: 3rem 1rem; color: var(--text-muted);">Ничего не найдено</div>';
        return;
      }

      if (viewMode === 'grid') {
        catalogGrid.style.display = 'grid';
        catalogList.style.display = 'none';
        catalogGrid.innerHTML = slice.map(it => {
          const isCur = it.id === currentVideo?.id;
          return `
            <div class="media-card ${isCur ? 'is-current' : ''}" data-id="${it.id}">
              <div class="card-thumb-box">
                <img src="https://i.ytimg.com/vi/${it.id}/mqdefault.jpg" loading="lazy" alt="">
                <span class="card-cat-badge">${getCategoryName(it.tag)}</span>
                <span class="card-duration">#${it.originalIndex}</span>
              </div>
              <div class="card-body">
                <h3 class="card-title-text">${it.title}</h3>
                <div class="card-foot">
                  <span class="play-now-label">${isCur ? '▶ Играет' : 'Смотреть'}</span>
                  <span style="color: var(--text-muted);">${it.cat.split(' ')[0]}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
        attachEvents(catalogGrid);
      } else {
        catalogGrid.style.display = 'none';
        catalogList.style.display = 'flex';
        catalogList.innerHTML = slice.map(it => {
          const isCur = it.id === currentVideo?.id;
          return `
            <div class="list-item ${isCur ? 'is-current' : ''}" data-id="${it.id}">
              <img class="list-thumb" src="https://i.ytimg.com/vi/${it.id}/default.jpg" loading="lazy" alt="">
              <div class="list-body">
                <div class="list-title">${it.title}</div>
                <div class="list-meta">#${it.originalIndex} • ${getCategoryName(it.tag)}</div>
              </div>
            </div>
          `;
        }).join('');
        attachEvents(catalogList);
      }
    }

    function attachEvents(parent) {
      parent.querySelectorAll('[data-id]').forEach(el => {
        el.addEventListener('click', () => {
          const it = ITEMS.find(x => x.id === el.dataset.id);
          if (it) playVideo(it, true, true);
        });
      });
    }

    // Actions
    actionFavBtn.addEventListener('click', () => {
      if (currentVideo) toggleFav(currentVideo.id);
    });

    actionWatchedBtn.addEventListener('click', () => {
      if (currentVideo) toggleWatched(currentVideo.id);
    });

    actionPrevBtn.addEventListener('click', playPrev);
    actionNextBtn.addEventListener('click', playNext);

    actionShareBtn.addEventListener('click', () => {
      if (!currentVideo) return;
      const u = window.location.origin + window.location.pathname + '#v=' + currentVideo.id;
      navigator.clipboard.writeText(u).then(() => {
        showToast('✓ Ссылка скопирована');
      }).catch(() => {
        navigator.clipboard.writeText(currentVideo.url).then(() => {
          showToast('✓ Ссылка YouTube скопирована');
        });
      });
    });

    actionSpeedBtn.addEventListener('click', () => {
      const speeds = [1, 1.25, 1.5, 1.75, 2];
      const curIdx = speeds.indexOf(playbackSpeed);
      const nxt = speeds[(curIdx + 1) % speeds.length];
      playbackSpeed = nxt;
      actionSpeedBtn.textContent = `${nxt}x Скорость`;
      if (ytPlayer && typeof ytPlayer.setPlaybackRate === 'function') {
        ytPlayer.setPlaybackRate(nxt);
      }
      showToast(`Скорость: ${nxt}x`);
    });

    btnModeGrid.addEventListener('click', () => {
      viewMode = 'grid';
      btnModeGrid.classList.add('active');
      btnModeList.classList.remove('active');
      renderFeed();
    });

    btnModeList.addEventListener('click', () => {
      viewMode = 'list';
      btnModeList.classList.add('active');
      btnModeGrid.classList.remove('active');
      renderFeed();
    });

    btnLoadMore.addEventListener('click', () => {
      limit += CHUNK_SIZE;
      applyFilter();
    });

    mainSearch.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      searchClearBtn.style.display = searchQuery ? 'block' : 'none';
      limit = CHUNK_SIZE;
      applyFilter();
    });

    searchClearBtn.addEventListener('click', () => {
      mainSearch.value = '';
      searchQuery = '';
      searchClearBtn.style.display = 'none';
      limit = CHUNK_SIZE;
      applyFilter();
      mainSearch.focus();
    });

    // Header buttons
    document.getElementById('headerFavBtn').addEventListener('click', () => {
      currentCategory = currentCategory === 'fav' ? 'all' : 'fav';
      renderCategoryPills();
      applyFilter();
      if (currentCategory === 'fav') showToast('Фильтр: Избранное');
    });

    document.getElementById('headerShuffleBtn').addEventListener('click', playShuffle);

    // Desktop nav
    const deskNavAll = document.getElementById('deskNavAll');
    const deskNavPodcasts = document.getElementById('deskNavPodcasts');
    const deskNavDebates = document.getElementById('deskNavDebates');
    const deskNavPeriscope = document.getElementById('deskNavPeriscope');
    const deskNavFavs = document.getElementById('deskNavFavs');

    function setDeskActive(btn) {
      document.querySelectorAll('.nav-link-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    deskNavAll.addEventListener('click', () => {
      currentCategory = 'all';
      setDeskActive(deskNavAll);
      renderCategoryPills();
      applyFilter();
    });
    deskNavPodcasts.addEventListener('click', () => {
      currentCategory = 'podcasts';
      setDeskActive(deskNavPodcasts);
      renderCategoryPills();
      applyFilter();
    });
    deskNavDebates.addEventListener('click', () => {
      currentCategory = 'debates';
      setDeskActive(deskNavDebates);
      renderCategoryPills();
      applyFilter();
    });
    deskNavPeriscope.addEventListener('click', () => {
      currentCategory = 'periscope';
      setDeskActive(deskNavPeriscope);
      renderCategoryPills();
      applyFilter();
    });
    deskNavFavs.addEventListener('click', () => {
      currentCategory = 'fav';
      setDeskActive(deskNavFavs);
      renderCategoryPills();
      applyFilter();
    });

    // Bottom Navigation (Mobile)
    document.getElementById('tabHome').addEventListener('click', () => {
      currentCategory = 'all';
      searchQuery = '';
      mainSearch.value = '';
      renderCategoryPills();
      applyFilter();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('tabSearch').addEventListener('click', () => {
      mainSearch.focus();
      mainSearch.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    document.getElementById('tabFavs').addEventListener('click', () => {
      currentCategory = 'fav';
      renderCategoryPills();
      applyFilter();
      document.querySelector('.controls-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('tabShuffle').addEventListener('click', playShuffle);

    // Boot
    renderCategoryPills();
    applyFilter();
    playVideo(currentVideo, false, false);
  </script>
</body>
</html>
