<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Избранное и История — Архив Арсена Маркаряна</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/catalog.css">
  <style>
    .fav-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }
    .fav-tab-btn {
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    .fav-tab-btn.active {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold-light);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
  </style>
</head>
<body>
  
  <header class="site-header">
    <div class="header-brand">
      <a href="index.html" style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:1.6rem;">⚡</span>
        <span class="brand-logo">АРСЕН МАРКАРЯН</span>
      </a>
      <span class="brand-sub">Официальный медиа-архив</span>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link ">🏠 Главная</a>
      <a href="catalog.html" class="nav-link ">📚 Каталог всех видео</a>
      <a href="favorites.html" class="nav-link active">
        ❤️ Избранное <span class="nav-counter fav-badge-count" style="display:none;">0</span>
      </a>
    </nav>
    <div class="header-actions">
      <a href="catalog.html" class="btn btn-primary" style="padding: 6px 14px; font-size: 0.82rem;">
        <span>🔍</span> Перейти в каталог
      </a>
      <button class="btn-menu" id="btnToggleSidebar" title="Меню каталога">☰</button>
    </div>
  </header>

  <!-- Mobile Bottom Nav -->
  <div class="mobile-bottom-nav">
    <a href="index.html" class="mob-nav-item ">
      <span class="mob-nav-icon">🏠</span>
      <span>Главная</span>
    </a>
    <a href="catalog.html" class="mob-nav-item ">
      <span class="mob-nav-icon">📚</span>
      <span>Каталог</span>
    </a>
    <a href="favorites.html" class="mob-nav-item active">
      <span class="mob-nav-icon">❤️</span>
      <span>Избранное</span>
    </a>
  </div>


  <main style="max-width: 1440px; margin: 0 auto; padding: 32px 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 style="font-size: 1.8rem; font-weight: 800;">❤️ Моя коллекция</h1>
      <button class="btn btn-secondary" onclick="clearActiveTab()" style="font-size: 0.85rem;">Очистить</button>
    </div>

    <div class="fav-tabs">
      <button class="fav-tab-btn active" id="tabFavs" onclick="switchTab('favs')">❤️ Избранное (<span id="favsCount">0</span>)</button>
      <button class="fav-tab-btn" id="tabHist" onclick="switchTab('hist')">🕒 История просмотров (<span id="histCount">0</span>)</button>
    </div>

    <div class="catalog-grid" id="favGrid" style="padding: 0;">
      <!-- Populated via script below -->
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentTab = 'favs';
    let allVids = [];

    async function loadCollection() {
      allVids = await API.getVideos();
      renderCollection();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabFavs').classList.toggle('active', tab === 'favs');
      document.getElementById('tabHist').classList.toggle('active', tab === 'hist');
      renderCollection();
    }

    function renderCollection() {
      const favIds = Storage.getFavorites();
      const historyItems = Storage.getHistory();

      document.getElementById('favsCount').textContent = favIds.length;
      document.getElementById('histCount').textContent = historyItems.length;

      const grid = document.getElementById('favGrid');

      if (currentTab === 'favs') {
        const vids = allVids.filter(v => favIds.includes(v.id));
        if (vids.length === 0) {
          grid.innerHTML = '<div class="catalog-empty"><div class="empty-icon">🤍</div><h3>В избранном пока пусто</h3><p>Добавляйте видео сердечком в каталоге, чтобы смотреть их позже</p><a href="catalog.html" class="btn btn-primary" style="margin-top:14px;">Перейти в каталог</a></div>';
          return;
        }
        renderCards(vids, grid);
      } else {
        const histIds = historyItems.map(x => x.id);
        const vids = histIds.map(id => allVids.find(v => v.id === id)).filter(Boolean);
        if (vids.length === 0) {
          grid.innerHTML = '<div class="catalog-empty"><div class="empty-icon">🕒</div><h3>История просмотров пуста</h3><p>Начните смотреть видео, и они появятся здесь</p></div>';
          return;
        }
        renderCards(vids, grid);
      }
    }

    function renderCards(videos, container) {
      let html = '';
      videos.forEach(v => {
        const isFav = Storage.isFavorite(v.id);
        html += `
          <div class="video-card">
            <div class="card-thumb-wrap">
              <img class="card-thumb" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="${v.title}">
              <div class="thumb-overlay">
                <div class="card-badges-top">
                  <span class="badge" style="background:${v.badgeColor}22; color:${v.badgeColor}; border:1px solid ${v.badgeColor}55;">
                    ${v.catIcon} ${v.catName}
                  </span>
                  ${v.durationFormatted ? `<span class="card-dur-badge">${v.durationFormatted}</span>` : ''}
                </div>
              </div>
            </div>
            <div class="card-body">
              <h4 class="card-title">${v.title}</h4>
              <div class="card-meta">
                <span>📅 ${v.year}</span>
                ${v.viewsFormatted ? `<span>👁️ ${v.viewsFormatted}</span>` : ''}
              </div>
            </div>
            <div class="card-actions">
              <a href="watch.html?v=${v.id}" class="btn-play-card">
                <span>▶️</span> Смотреть
              </a>
              <button class="btn-fav-card ${isFav ? 'active' : ''}" onclick="toggleCollectionFav('${v.id}')">
                ${isFav ? '❤️' : '🤍'}
              </button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function toggleCollectionFav(id) {
      Storage.toggleFavorite(id);
      renderCollection();
    }

    function clearActiveTab() {
      if (currentTab === 'favs') {
        localStorage.removeItem('amm_favs');
      } else {
        Storage.clearHistory();
      }
      Storage.updateCounters();
      renderCollection();
    }

    document.addEventListener('DOMContentLoaded', loadCollection);
  </script>
</body>
</html>
