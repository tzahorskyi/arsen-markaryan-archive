<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кинозал — Просмотр видео Арсена Маркаряна</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/watch.css">
</head>
<body>
  
  <header class="site-header">
    <div class="header-brand">
      <a href="index.html" style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:1.6rem;">⚡</span>
        <span class="brand-logo">АРСЕН МАРКАРЯН</span>
      </a>
      <span class="brand-sub">Официальный медиа-архив</span>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link ">🏠 Главная</a>
      <a href="catalog.html" class="nav-link ">📚 Каталог всех видео</a>
      <a href="favorites.html" class="nav-link ">
        ❤️ Избранное <span class="nav-counter fav-badge-count" style="display:none;">0</span>
      </a>
    </nav>
    <div class="header-actions">
      <a href="catalog.html" class="btn btn-primary" style="padding: 6px 14px; font-size: 0.82rem;">
        <span>🔍</span> Перейти в каталог
      </a>
      <button class="btn-menu" id="btnToggleSidebar" title="Меню каталога">☰</button>
    </div>
  </header>

  <!-- Mobile Bottom Nav -->
  <div class="mobile-bottom-nav">
    <a href="index.html" class="mob-nav-item ">
      <span class="mob-nav-icon">🏠</span>
      <span>Главная</span>
    </a>
    <a href="catalog.html" class="mob-nav-item ">
      <span class="mob-nav-icon">📚</span>
      <span>Каталог</span>
    </a>
    <a href="favorites.html" class="mob-nav-item ">
      <span class="mob-nav-icon">❤️</span>
      <span>Избранное</span>
    </a>
  </div>


  <div class="watch-page-container">
    <!-- LEFT MAIN THEATER STAGE -->
    <div class="watch-main-stage">
      <div class="player-frame-wrap">
        <iframe id="playerIframe" class="player-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>

      <div class="watch-info-panel">
        <h1 class="watch-title" id="watchTitle">Загрузка видео...</h1>
        <div class="watch-meta-row">
          <div class="watch-badges">
            <a href="catalog.html" id="watchCatBadge" class="badge badge-gold">Категория</a>
            <span id="watchSubBadge" class="badge badge-cyan" style="display:none;"></span>
            <span id="watchYear" class="badge badge-dim">📅 Год</span>
            <span id="watchDuration" class="badge badge-dim">⏱️ Длительность</span>
            <span id="watchViews" class="badge badge-dim">👁️ Просмотры</span>
          </div>

          <div class="watch-actions-bar">
            <button id="btnToggleFavWatch" class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.85rem;">
              🤍 В избранное
            </button>
            <button id="btnShareWatch" class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.85rem;">
              🔗 Поделиться
            </button>
            <a id="btnOpenYt" href="#" target="_blank" rel="noopener" class="btn btn-secondary" style="padding: 6px 14px; font-size: 0.85rem;">
              ↗️ На YouTube
            </a>
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 8px;">
          <a href="catalog.html" class="btn btn-secondary" style="font-size: 0.85rem;">
            ← Вернуться в каталог
          </a>
        </div>
      </div>
    </div>

    <!-- RIGHT QUEUE / PLAYLIST SIDEBAR -->
    <div class="watch-queue-sidebar">
      <div class="queue-card">
        <div class="queue-header">
          <span id="queueCatTitle">Следующие видео</span>
          <span style="font-size: 0.8rem; color: var(--gold);">Плейлист</span>
        </div>
        <div class="queue-list" id="queueList">
          <!-- Rendered by player.js -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
